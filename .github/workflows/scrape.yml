name: Scheduled Museum Scraper

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual triggering from GitHub Actions UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Scraper
        run: npm run scrape

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Check if there are changed files
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Changes detected, committing..."
            git add scraped_artifacts.csv scraped_cinema.csv public/assets/artifacts/ src/data/artifacts.ts src/data/cinema.ts
            git commit -m "chore(data): auto-update scraped museum datasets [skip ci]"
            git push
          else
            echo "No changes detected. Skipping commit."
          fi
